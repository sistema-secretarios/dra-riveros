<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Judicial</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .month-nav {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        #month-year-display {
            font-size: 1.5em;
            min-width: 180px;
            text-align: center;
        }
        #search-filter {
            flex-grow: 1;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
            min-width: 200px;
        }
        button {
            padding: 8px 15px;
            background: #e9ecef;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 15px;
        }
        .btn-activities {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 15px;
        }
        .btn-audiencias {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 12px 15px;
        }
        .btn-vencimientos {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 12px 15px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        .day-name {
            font-weight: bold;
            color: #555;
            padding: 10px 0;
        }
        .day {
            padding: 20px 4px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #eee;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .day:hover:not(.empty) {
            background-color: #f0f0f0;
        }
        .empty {
            background-color: #f8f8f8;
            cursor: default;
        }
        .current-day {
            background-color: #28a745;
            color: white;
            font-weight: bold;
        }
        .has-event {
            background-color: #ff9800 !important;
            color: #333 !important;
            border: 2px solid #ff9800;
        }
        .event-count {
            position: absolute;
            top: 3px;
            right: 3px;
            background: #ff5722;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            padding-top: 40px;
            overflow: auto;
        }
        .modal-content {
            background-color: #fefefe;
            margin: 3% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content button.btn-primary {
            margin-bottom: 15px;
        }
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .audiencia {
            border-left: 5px solid #ff9800;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #ffe0b2;
            border-radius: 5px;
        }
        .vencimiento {
            border-left: 5px solid #e91e63;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #ffcdd2;
            border-radius: 5px;
        }
        .actividad {
            border-left: 5px solid #28a745;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #d4edda;
            border-radius: 5px;
        }
        .event-details {
            margin-top: 8px;
        }
        .event-details div {
            margin-bottom: 5px;
        }
        .event-source {
            font-size: 0.9em;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1.2em;
            color: #666;
        }
        .search-match {
            box-shadow: 0 0 0 3px #007bff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 123, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 123, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 123, 255, 0); }
        }
        .events-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        @media (max-width: 768px) {
            .calendar-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .month-nav {
                justify-content: center;
            }
            .events-buttons {
                justify-content: center;
            }
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="calendar-controls">
                <input type="text" id="search-filter" placeholder="Buscar Expediente, Detalle..." onkeyup="handleSearchFilter()">
                <div class="month-nav">
                    <button onclick="prevMonth()">←</button>
                    <h3 id="month-year-display"></h3>
                    <button onclick="nextMonth()">→</button>
                    <button class="btn-primary" onclick="goToToday()">HOY</button>
                    <div class="events-buttons">
                        <button class="btn-audiencias" onclick="openAudienciasModal()">🎯 Audiencias</button>
                        <button class="btn-vencimientos" onclick="openVencimientosModal()">⏰ Vencimientos</button>
                        <button class="btn-activities" onclick="openActivitiesModal()">📋 Actividades</button>
                    </div>
                    <button class="btn-primary" onclick="loadEventsFromFirebase()" id="reload-btn">🔄 Actualizar</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendar-grid">
                <div class="loading">Cargando eventos...</div>
            </div>
        </div>
    </div>

    <div id="view-day-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('view-day-modal')">&times;</span>
            <h2 id="view-day-title" style="color: #28a745;"></h2>
            <button class="btn-primary" onclick="printModalContent('day-events-list', 'view-day-title')">Imprimir</button>
            <div id="day-events-list"></div>
            <p id="no-events-message" style="display: none; color: gray;">No hay eventos registrados para esta fecha.</p>
        </div>
    </div>

    <div id="activities-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('activities-modal')">&times;</span>
            <h2 style="color: #28a745;">Todas las Actividades</h2>
            <button class="btn-primary" onclick="printModalContent('activities-list', 'Todas las Actividades')">Imprimir</button>
            <div id="activities-list"></div>
            <p id="no-activities-message" style="display: none; color: gray;">No hay actividades registradas.</p>
        </div>
    </div>

    <div id="audiencias-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('audiencias-modal')">&times;</span>
            <h2 style="color: #ff9800;">Todas las Audiencias</h2>
            <button class="btn-primary" onclick="printModalContent('audiencias-list', 'Todas las Audiencias')">Imprimir</button>
            <div id="audiencias-list"></div>
            <p id="no-audiencias-message" style="display: none; color: gray;">No hay audiencias registradas.</p>
        </div>
    </div>

    <div id="vencimientos-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('vencimientos-modal')">&times;</span>
            <h2 style="color: #e91e63;">Todos los Vencimientos</h2>
            <button class="btn-primary" onclick="printModalContent('vencimientos-list', 'Todas los Vencimientos')">Imprimir</button>
            <div id="vencimientos-list"></div>
            <p id="no-vencimientos-message" style="display: none; color: gray;">No hay vencimientos registrados.</p>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURACIÓN DE FIREBASE (dos bases de datos)
        // ============================================================
        // Base Histórica (causas-defensoria)
        const firebaseConfigHistorica = {
            apiKey: "AIzaSyBt6X0u0BpiNPcV2SNPrN-spCmjl2AhZaA",
            authDomain: "causas-defensoria.firebaseapp.com",
            projectId: "causas-defensoria",
            storageBucket: "causas-defensoria.appspot.com",
            messagingSenderId: "186064671470",
            appId: "1:186064671470:web:b58bae5eadbe6e469f19ff"
        };
        // Base Nueva (causas-2defensoria)
        const firebaseConfigNueva = {
            apiKey: "AIzaSyBevCwkh4iOWVqhp3gG2ae1eCUMkFpnr6I",
            authDomain: "causas-2defensoria.firebaseapp.com",
            projectId: "causas-2defensoria",
            storageBucket: "causas-2defensoria.firebasestorage.app",
            messagingSenderId: "663905632804",
            appId: "1:663905632804:web:4f686a88004dc642ad0eb1"
        };

        let dbHistorica, dbNueva;

        try {
            let appHistorica, appNueva;
            if (firebase.apps.length === 0) {
                appHistorica = firebase.initializeApp(firebaseConfigHistorica, "historica");
                appNueva = firebase.initializeApp(firebaseConfigNueva, "nueva");
            } else {
                appHistorica = firebase.app("historica") || firebase.initializeApp(firebaseConfigHistorica, "historica");
                appNueva = firebase.app("nueva") || firebase.initializeApp(firebaseConfigNueva, "nueva");
            }
            dbHistorica = appHistorica.firestore();
            dbNueva = appNueva.firestore();
            // Habilitar persistencia (opcional)
            dbHistorica.enablePersistence().catch(err => console.warn("Persistencia histórica:", err));
            dbNueva.enablePersistence().catch(err => console.warn("Persistencia nueva:", err));
        } catch (e) {
            console.error("Error inicializando Firebase:", e);
        }

        // ============================================================
        // VARIABLES GLOBALES
        // ============================================================
        let judicialEvents = [];       // Array de eventos en formato plano
        let currentCalendarDate = new Date();
        const DAYS_OF_WEEK = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
        const MONTH_NAMES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        // ============================================================
        // UTILIDADES DE FECHA
        // ============================================================
        function toDate(val) {
            if (!val) return null;
            if (val.toDate) return val.toDate();
            if (val.seconds) return new Date(val.seconds * 1000);
            if (val instanceof Date) return val;
            return new Date(val);
        }

        function formatDateToDDMMYYYY(date) {
            if (!date) return null;
            const d = toDate(date);
            if (!d || isNaN(d)) return null;
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function formatTime(date) {
            const d = toDate(date);
            if (!d || isNaN(d)) return "00:00";
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function parseDateFromDDMMYYYY(str) {
            const parts = str.split('/');
            if (parts.length !== 3) return null;
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const year = parseInt(parts[2], 10);
            return new Date(year, month, day);
        }

        // ============================================================
        // DETERMINAR PROCESO (para modoIntervencion)
        // ============================================================
        function determinarProceso(juzgado) {
            if (!juzgado) return "Penal";
            const j = juzgado.toLowerCase();
            if (j.includes("violencia familiar")) return "Violencia Familiar";
            if (j.includes("familia")) return "Familia";
            if (j.includes("instruccion") || j.includes("penal")) return "Penal";
            if (j.includes("civil")) return "Civil";
            if (j.includes("laboral")) return "Laboral";
            return "Penal";
        }

        // ============================================================
        // CARGAR EVENTOS DESDE AMBAS BASES (API unificada)
        // ============================================================
        async function loadEventsFromFirebase() {
            try {
                document.getElementById('calendar-grid').innerHTML = '<div class="loading">Cargando eventos desde Firebase...</div>';
                judicialEvents = [];

                // Obtener ambas colecciones en paralelo
                const [snapshotHistorica, snapshotNueva] = await Promise.all([
                    dbHistorica.collection("causas").get(),
                    dbNueva.collection("causas").get()
                ]);

                const eventos = [];

                // Función para procesar una causa y extraer todos los eventos
                const procesarCausa = (causa, fuente) => {
                    const juzgado = causa.juzgado || '';
                    const proceso = determinarProceso(juzgado);
                    const numCausa = causa.numCausa || causa.expediente || 'S/N';
                    const caratula = causa.caratula || '';

                    // Audiencias
                    if (Array.isArray(causa.audiencias)) {
                        causa.audiencias.forEach(fecha => {
                            const fechaObj = toDate(fecha);
                            if (fechaObj && !isNaN(fechaObj)) {
                                eventos.push({
                                    date: fechaObj,
                                    time: formatTime(fechaObj),
                                    type: 'Audiencia',
                                    expte: numCausa,
                                    juzgado: juzgado,
                                    modoIntervencion: proceso,
                                    description: caratula || 'Audiencia',
                                    class: 'audiencia',
                                    source: fuente,
                                    id: `${fuente}-${causa.id}-audiencia-${Date.now()}-${Math.random()}`
                                });
                            }
                        });
                    }

                    // Cámara Gesell (la tratamos como actividad)
                    if (causa.audienciaGesell) {
                        const fechaObj = toDate(causa.audienciaGesell);
                        if (fechaObj && !isNaN(fechaObj)) {
                            eventos.push({
                                date: fechaObj,
                                time: formatTime(fechaObj),
                                type: 'C. Gesell',
                                expte: numCausa,
                                juzgado: juzgado,
                                modoIntervencion: proceso,
                                description: caratula || 'Cámara Gesell',
                                class: 'actividad',
                                source: fuente,
                                id: `${fuente}-${causa.id}-gesell-${Date.now()}-${Math.random()}`
                            });
                        }
                    }

                    // Vencimientos
                    if (causa.vencimiento) {
                        const fechaObj = toDate(causa.vencimiento);
                        if (fechaObj && !isNaN(fechaObj)) {
                            eventos.push({
                                date: fechaObj,
                                time: formatTime(fechaObj),
                                type: 'Vencimiento',
                                expte: numCausa,
                                juzgado: juzgado,
                                modoIntervencion: proceso,
                                description: caratula || 'Vencimiento',
                                class: 'vencimiento',
                                source: fuente,
                                id: `${fuente}-${causa.id}-vencimiento-${Date.now()}-${Math.random()}`
                            });
                        }
                    }

                    // Vencimiento de Recursos
                    if (causa.vencimientoRecursos) {
                        const fechaObj = toDate(causa.vencimientoRecursos);
                        if (fechaObj && !isNaN(fechaObj)) {
                            eventos.push({
                                date: fechaObj,
                                time: formatTime(fechaObj),
                                type: 'Recurso',
                                expte: numCausa,
                                juzgado: juzgado,
                                modoIntervencion: proceso,
                                description: caratula || 'Vencimiento de recurso',
                                class: 'vencimiento',
                                source: fuente,
                                id: `${fuente}-${causa.id}-recurso-${Date.now()}-${Math.random()}`
                            });
                        }
                    }

                    // Diligencias
                    if (Array.isArray(causa.diligencias)) {
                        causa.diligencias.forEach(d => {
                            const fechaObj = toDate(d.fecha);
                            if (fechaObj && !isNaN(fechaObj)) {
                                eventos.push({
                                    date: fechaObj,
                                    time: formatTime(fechaObj),
                                    type: 'Diligencia',
                                    expte: numCausa,
                                    juzgado: juzgado,
                                    modoIntervencion: proceso,
                                    description: d.detalle || caratula || 'Diligencia',
                                    class: 'actividad',
                                    source: fuente,
                                    id: `${fuente}-${causa.id}-diligencia-${Date.now()}-${Math.random()}`
                                });
                            }
                        });
                    }

                    // Actividades (si existen en miscausas, pero aquí las tratamos)
                    if (Array.isArray(causa.actividades)) {
                        causa.actividades.forEach(act => {
                            let fechaObj = null;
                            if (act.fechaHora) {
                                fechaObj = toDate(act.fechaHora);
                            } else if (act.fecha) {
                                fechaObj = toDate(act.fecha);
                            }
                            if (fechaObj && !isNaN(fechaObj)) {
                                eventos.push({
                                    date: fechaObj,
                                    time: formatTime(fechaObj),
                                    type: 'Actividad',
                                    expte: numCausa,
                                    juzgado: juzgado,
                                    modoIntervencion: proceso,
                                    description: act.detalle || caratula || 'Actividad',
                                    class: 'actividad',
                                    source: fuente,
                                    id: `${fuente}-${causa.id}-actividad-${Date.now()}-${Math.random()}`
                                });
                            }
                        });
                    }

                    // Otras actividades (otrasActividades)
                    if (Array.isArray(causa.otrasActividades)) {
                        causa.otrasActividades.forEach(act => {
                            let fechaObj = null;
                            if (act.fechaHora) {
                                fechaObj = toDate(act.fechaHora);
                            } else if (act.fecha) {
                                fechaObj = toDate(act.fecha);
                            }
                            if (fechaObj && !isNaN(fechaObj)) {
                                eventos.push({
                                    date: fechaObj,
                                    time: formatTime(fechaObj),
                                    type: 'Actividad',
                                    expte: numCausa,
                                    juzgado: juzgado,
                                    modoIntervencion: proceso,
                                    description: act.detalle || caratula || 'Actividad',
                                    class: 'actividad',
                                    source: fuente,
                                    id: `${fuente}-${causa.id}-otraActividad-${Date.now()}-${Math.random()}`
                                });
                            }
                        });
                    }
                };

                // Procesar documentos de la base histórica
                snapshotHistorica.forEach(doc => {
                    const causa = { id: doc.id, ...doc.data() };
                    procesarCausa(causa, 'Histórica');
                });

                // Procesar documentos de la base nueva
                snapshotNueva.forEach(doc => {
                    const causa = { id: doc.id, ...doc.data() };
                    procesarCausa(causa, 'Activa');
                });

                // Asignar a la variable global
                judicialEvents = eventos;

                if (eventos.length === 0) {
                    document.getElementById('calendar-grid').innerHTML = '<div class="loading">No se encontraron eventos en las colecciones.</div>';
                } else {
                    renderCalendar(currentCalendarDate);
                }

            } catch (error) {
                console.error("Error al cargar datos:", error);
                document.getElementById('calendar-grid').innerHTML = '<div class="loading">Error al cargar los eventos: ' + error.message + '</div>';
            }
        }

        // ============================================================
        // RENDERIZAR CALENDARIO
        // ============================================================
        function renderCalendar(date, searchDates = []) {
            try {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDayOfMonth = new Date(year, month, 1);
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const startDayIndex = firstDayOfMonth.getDay();

                document.getElementById('month-year-display').textContent = `${MONTH_NAMES[month]} ${year}`;
                const calendarGrid = document.getElementById('calendar-grid');
                calendarGrid.innerHTML = '';

                // Nombres de días
                DAYS_OF_WEEK.forEach(dayName => {
                    const dayNameDiv = document.createElement('div');
                    dayNameDiv.className = 'day-name';
                    dayNameDiv.textContent = dayName;
                    calendarGrid.appendChild(dayNameDiv);
                });

                // Celdas vacías iniciales
                for (let i = 0; i < startDayIndex; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'day empty';
                    calendarGrid.appendChild(emptyCell);
                }

                const today = new Date();
                const todayFormatted = formatDateToDDMMYYYY(today);

                // Días del mes
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayCell = document.createElement('div');
                    dayCell.className = 'day';
                    dayCell.textContent = day;

                    const dateObj = new Date(year, month, day);
                    const fullDateStr = formatDateToDDMMYYYY(dateObj);
                    const dateKey = fullDateStr; // DD/MM/YYYY

                    // Resaltar día actual
                    if (dateKey === todayFormatted) {
                        dayCell.classList.add('current-day');
                    }

                    // Eventos en este día
                    const eventsOnThisDay = judicialEvents.filter(ev => formatDateToDDMMYYYY(ev.date) === dateKey);
                    if (eventsOnThisDay.length > 0) {
                        dayCell.classList.add('has-event');
                        const eventCount = document.createElement('div');
                        eventCount.className = 'event-count';
                        eventCount.textContent = eventsOnThisDay.length;
                        dayCell.appendChild(eventCount);
                        dayCell.title = `${eventsOnThisDay.length} evento(s)`;
                    }

                    // Resaltar búsqueda
                    if (searchDates.includes(dateKey)) {
                        dayCell.classList.add('search-match');
                    }

                    dayCell.setAttribute('data-date', dateKey);
                    dayCell.onclick = () => openViewDayModal(dateKey);
                    calendarGrid.appendChild(dayCell);
                }
            } catch (error) {
                console.error("Error renderizando calendario:", error);
            }
        }

        // ============================================================
        // NAVEGACIÓN
        // ============================================================
        function prevMonth() {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1);
            renderCalendar(currentCalendarDate);
        }

        function nextMonth() {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1);
            renderCalendar(currentCalendarDate);
        }

        function goToToday() {
            currentCalendarDate = new Date();
            renderCalendar(currentCalendarDate);
        }

        // ============================================================
        // BÚSQUEDA
        // ============================================================
        function handleSearchFilter() {
            const filterText = document.getElementById('search-filter').value.toLowerCase();
            let matchingDates = [];

            if (filterText.length > 0) {
                matchingDates = judicialEvents
                    .filter(ev =>
                        (ev.expte && ev.expte.toLowerCase().includes(filterText)) ||
                        (ev.description && ev.description.toLowerCase().includes(filterText)) ||
                        (ev.type && ev.type.toLowerCase().includes(filterText)) ||
                        (ev.juzgado && ev.juzgado.toLowerCase().includes(filterText)) ||
                        (ev.modoIntervencion && ev.modoIntervencion.toLowerCase().includes(filterText))
                    )
                    .map(ev => formatDateToDDMMYYYY(ev.date));
                matchingDates = [...new Set(matchingDates)];
            }
            renderCalendar(currentCalendarDate, matchingDates);
        }

        // ============================================================
        // MODAL: VER EVENTOS DEL DÍA
        // ============================================================
        function openViewDayModal(dateStr) {
            try {
                const dateObj = parseDateFromDDMMYYYY(dateStr);
                if (!dateObj) return;
                const formattedDate = dateObj.toLocaleDateString('es-AR', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                document.getElementById('view-day-title').textContent = `Eventos para el ${formattedDate}`;
                const dayEventsList = document.getElementById('day-events-list');
                const noEventsMessage = document.getElementById('no-events-message');
                dayEventsList.innerHTML = '';

                const eventsOfTheDay = judicialEvents
                    .filter(ev => formatDateToDDMMYYYY(ev.date) === dateStr)
                    .sort((a, b) => a.time.localeCompare(b.time));

                if (eventsOfTheDay.length > 0) {
                    noEventsMessage.style.display = 'none';
                    eventsOfTheDay.forEach(event => {
                        const eventDiv = document.createElement('div');
                        eventDiv.className = event.class || 'actividad';
                        eventDiv.innerHTML = `
                            <div style="font-weight: bold; font-size: 1.1em; margin-bottom: 8px;">
                                ${event.time} - ${event.type}
                            </div>
                            <div class="event-details">
                                <div><strong>Expediente:</strong> ${event.expte}</div>
                                <div><strong>Juzgado:</strong> ${event.juzgado}</div>
                                <div><strong>Modo de Intervención:</strong> ${event.modoIntervencion}</div>
                                <div><strong>Detalle:</strong> ${event.description}</div>
                            </div>
                            <div class="event-source">
                                Fuente: ${event.source}
                            </div>
                        `;
                        dayEventsList.appendChild(eventDiv);
                    });
                } else {
                    noEventsMessage.style.display = 'block';
                }
                document.getElementById('view-day-modal').style.display = 'block';
            } catch (error) {
                console.error("Error abriendo modal:", error);
            }
        }

        // ============================================================
        // MODALES: TODAS LAS ACTIVIDADES, AUDIENCIAS, VENCIMIENTOS
        // ============================================================
        function openActivitiesModal() {
            openModalPorTipo('activities-list', 'no-activities-message', 'Actividad', 'Todas las Actividades', 'actividad');
        }
        function openAudienciasModal() {
            openModalPorTipo('audiencias-list', 'no-audiencias-message', 'Audiencia', 'Todas las Audiencias', 'audiencia');
        }
        function openVencimientosModal() {
            openModalPorTipo('vencimientos-list', 'no-vencimientos-message', ['Vencimiento', 'Recurso'], 'Todos los Vencimientos', 'vencimiento');
        }

        function openModalPorTipo(listId, msgId, tipos, titulo, clase) {
            try {
                const listElement = document.getElementById(listId);
                const msgElement = document.getElementById(msgId);
                listElement.innerHTML = '';

                // Normalizar tipos a array
                if (!Array.isArray(tipos)) tipos = [tipos];
                const filtrados = judicialEvents
                    .filter(ev => tipos.includes(ev.type))
                    .sort((a, b) => a.date - b.date); // orden cronológico

                if (filtrados.length > 0) {
                    msgElement.style.display = 'none';
                    filtrados.forEach(ev => {
                        const div = document.createElement('div');
                        div.className = clase;
                        const fechaStr = formatDateToDDMMYYYY(ev.date);
                        div.innerHTML = `
                            <div style="font-weight: bold; font-size: 1.1em; margin-bottom: 8px;">
                                ${fechaStr} - ${ev.time} - ${ev.type}
                            </div>
                            <div class="event-details">
                                <div><strong>Expediente:</strong> ${ev.expte}</div>
                                <div><strong>Juzgado:</strong> ${ev.juzgado}</div>
                                <div><strong>Modo de Intervención:</strong> ${ev.modoIntervencion}</div>
                                <div><strong>Detalle:</strong> ${ev.description}</div>
                            </div>
                            <div class="event-source">
                                Fuente: ${ev.source}
                            </div>
                        `;
                        listElement.appendChild(div);
                    });
                } else {
                    msgElement.style.display = 'block';
                }

                // Abrir el modal correspondiente según el listId
                const modalId = listId.replace('-list', '-modal');
                document.getElementById(modalId).style.display = 'block';
            } catch (error) {
                console.error("Error abriendo modal:", error);
            }
        }

        // ============================================================
        // FUNCIONES AUXILIARES (modal, impresión, cierre)
        // ============================================================
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function printModalContent(contentId, titleSource) {
            const contentToPrint = document.getElementById(contentId).innerHTML;
            let title = '';
            const titleElement = document.getElementById(titleSource);
            if (titleElement) {
                title = titleElement.textContent;
            } else {
                title = titleSource;
            }

            const printWindow = window.open('', '_blank', 'height=600,width=800');
            printWindow.document.write('<html><head><title>Imprimir</title>');
            printWindow.document.write('<style>');
            printWindow.document.write(`
                body { font-family: 'Arial', sans-serif; color: #333; margin: 20px; }
                h2 { color: #333; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
                .audiencia, .vencimiento, .actividad {
                    border-left-width: 5px;
                    border-left-style: solid;
                    padding: 15px;
                    margin-bottom: 15px;
                    border-radius: 5px;
                    page-break-inside: avoid;
                }
                .audiencia { border-left-color: #ff9800; background-color: #ffe0b2; }
                .vencimiento { border-left-color: #e91e63; background-color: #ffcdd2; }
                .actividad { border-left-color: #28a745; background-color: #d4edda; }
                .event-details div { margin-bottom: 5px; }
                .event-source { font-size: 0.9em; color: #666; margin-top: 8px; font-style: italic; }
                strong { font-weight: bold; }
            `);
            printWindow.document.write('</style></head><body>');
            printWindow.document.write(`<h2>${title}</h2>`);
            printWindow.document.write(contentToPrint);
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => {
                printWindow.print();
                printWindow.close();
            }, 250);
        }

        // Cerrar modal al hacer clic fuera
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = "none";
            }
        };

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadEventsFromFirebase();
        });
    </script>
</body>
</html>
